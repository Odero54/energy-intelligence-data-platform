[project]
name = "energy-intelligence-data-platform"
version = "0.1.0"
description = "End-to-end energy access gap analysis platform for the Global South"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    # Geospatial
    "geopandas>=0.14",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "shapely>=2.0",
    "fiona>=1.9",
    "pyproj>=3.6",
    "xarray>=2024.1",
    # Snowflake
    "snowflake-connector-python[pandas]>=3.7",
    "snowflake-sqlalchemy>=1.5",
    # dbt
    "dbt-snowflake>=1.7",
    # Google Earth Engine
    "earthengine-api>=0.1.390",
    # HTTP / API clients
    "httpx>=0.27",
    "requests>=2.31",
    # World Bank open data
    "wbgapi>=1.0",
    # Environment & config
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2",
    # Data processing
    "scipy>=1.13",
    "openpyxl>=3.1",
    # Visualisation (notebooks / QA)
    "matplotlib>=3.8",
    "folium>=0.16",
    "plotly>=5.20",
    "cryptography>=47.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "processing"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ingestion --cov=processing --cov-report=term-missing"
